# ===========================================================
#  Netlify configuration — SIGTH (Reflejos Brillantes)
#  Aplicativo de Gestión de Talento Humano — SENA
# ===========================================================

[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

# Plugin oficial de Next.js para Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers de seguridad básicos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache largo para assets estáticos de Next.js
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache medio para los .docx de contratos y afiliaciones
[[headers]]
  for = "/download/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
