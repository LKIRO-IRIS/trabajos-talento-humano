# ===========================================================
#  Netlify configuration — SIGTH (Reflejos Brillantes)
#  Optimizado para que el build NO se quede pegado
# ===========================================================

[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  # Evita que prisma intente generar el cliente (ya no lo usamos)
  PRISMA_SKIP_POSTINSTALL_GENERATE = "true"
  # DATABASE_URL dummy (algunas libs lo piden)
  DATABASE_URL = "file:./dev.db"

# Plugin oficial de Next.js
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache largo para assets estáticos
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache para los .docx de contratos y afiliaciones
[[headers]]
  for = "/download/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
